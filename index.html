<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>每日計畫｜今日份牛馬人的一天</title>
<style>
:root{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#19233b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.page{width:min(1100px,calc(100% - 40px));margin:auto;padding:42px 0}.topline,.brand,.card-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{justify-content:flex-start}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#6d5ce8;color:#fff;font-size:21px}.brand-name{font-size:15px;font-weight:750}.date-pill,.tag{padding:8px 12px;border:1px solid #e9edf4;border-radius:999px;background:#fff;color:#59647b;font-size:12px}.hero{margin:32px 0 26px}.eyebrow{color:#6d5ce8;font-size:12px;font-weight:750;letter-spacing:.13em}h1{margin:8px 0;font-size:clamp(29px,4vw,39px)}.subtitle,.event-note,.todo-meta{color:#78839a;font-size:13px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:21px;align-items:start}.stack{display:grid;gap:21px}.card{padding:23px;border:1px solid #e9edf4;border-radius:18px;background:#fff;box-shadow:0 5px 20px #23345c08}.card-heading{margin-bottom:20px}.card-heading h2{margin:0;font-size:17px}.count{color:#78839a;font-size:12px}.agenda-item{display:grid;grid-template-columns:60px 3px 1fr auto;gap:14px;align-items:center;padding:15px 0;border-top:1px solid #e9edf4}.agenda-item:first-child,.todo-item:first-child{border-top:0;padding-top:0}.time{font-size:13px;font-weight:700}.timebar{height:37px;border-radius:4px;background:#6d5ce8}.agenda-item:nth-child(2) .timebar{background:#38b99a}.agenda-item:nth-child(3) .timebar{background:#f0a84b}.event-title,.todo-title{margin:0;font-size:14px}.event-note,.todo-meta{margin:5px 0 0;font-size:12px}.tag{border:0;background:#f3f5f9;font-size:11px}.todo-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #e9edf4}.check{display:grid;place-items:center;flex:0 0 20px;height:20px;border:1.5px solid #d4dbea;border-radius:7px;color:#fff}.done .check{border-color:#50b89a;background:#50b89a}.todo-copy{flex:1}.done .todo-title{color:#9aa3b3;text-decoration:line-through}.status{padding:5px 8px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap}.status-done{background:#e9f8f2;color:#278466}.status-progress{background:#fff4df;color:#b87815}.status-pending{background:#f0edff;color:#6756d0}
.form-card{position:sticky;top:20px}.form-intro{margin:-10px 0 20px;color:#78839a;font-size:12px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;color:#48536a;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #e1e6ef;border-radius:9px;background:#fff;color:#19233b;font-size:13px}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #d8d2ff;border-color:#6d5ce8}.field textarea{min-height:76px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.submit{width:100%;padding:12px;border:0;border-radius:10px;background:#6d5ce8;color:#fff;font-weight:700;cursor:pointer}.submit:hover{background:#5949d2}.notice{min-height:18px;color:#278466;font-size:12px}
@media(max-width:760px){.page{width:calc(100% - 28px);padding-top:25px}.layout{grid-template-columns:1fr}.form-card{position:static}.card{padding:19px}}@media(max-width:430px){.agenda-item{grid-template-columns:50px 3px 1fr;gap:10px}.agenda-item .tag{display:none}.date-pill{font-size:11px}}
</style></head><body><main class="page">
<header class="topline"><div class="brand"><span class="brand-mark">✦</span><span class="brand-name">DAYNOTE ／每日計畫</span></div><time class="date-pill" id="today"></time></header>
<section class="hero"><p class="eyebrow">YOUR DAY, IN FOCUS</p><h1>今日份牛馬人的一天</h1><p class="subtitle">把重要的事一件一件做好，今天也會是充實的一天。</p></section>
<div class="layout"><div class="stack">
<section class="card"><div class="card-heading"><h2>今日行程</h2><span class="count">共 3 個行程</span></div><div class="agenda-list">
<article class="agenda-item"><time class="time">09:00</time><span class="timebar"></span><div><h3 class="event-title">晨間例會</h3><p class="event-note">確認本週進度與目標</p></div><span class="tag">💼 工作</span></article>
<article class="agenda-item"><time class="time">12:30</time><span class="timebar"></span><div><h3 class="event-title">和小安吃午餐</h3><p class="event-note">巷口日常咖啡 · 記得帶書</p></div><span class="tag">☕ 生活</span></article>
<article class="agenda-item"><time class="time">15:00</time><span class="timebar"></span><div><h3 class="event-title">專案提案準備</h3><p class="event-note">整理簡報最後幾頁</p></div><span class="tag">💼 工作</span></article>
</div></section>
<section class="card"><div class="card-heading"><h2>待辦事項</h2><span class="count">3 項任務</span></div><div class="todo-list">
<article class="todo-item done"><span class="check">✓</span><div class="todo-copy"><h3 class="todo-title">回覆客戶信件</h3><p class="todo-meta">上午完成</p></div><span class="status status-done">已完成</span></article>
<article class="todo-item"><span class="check"></span><div class="todo-copy"><h3 class="todo-title">整理會議紀錄</h3><p class="todo-meta">今天 · 工作</p></div><span class="status status-progress">進行中</span></article>
<article class="todo-item"><span class="check"></span><div class="todo-copy"><h3 class="todo-title">下班後去超市</h3><p class="todo-meta">今天 · 生活</p></div><span class="status status-pending">待處理</span></article>
</div></section></div>
<section class="card form-card"><div class="card-heading"><h2>新增行程</h2><span class="brand-mark" style="width:32px;height:32px">＋</span></div><p class="form-intro">安排一件新事情，讓今天的計畫更完整。</p>
<form id="event-form"><div class="field"><label for="event-name">行程名稱</label><input id="event-name" name="event-name" placeholder="例如：和同事討論企劃" required></div>
<div class="field-row"><div class="field"><label for="event-date">日期</label><input id="event-date" name="event-date" type="date" required></div><div class="field"><label for="event-time">開始時間</label><input id="event-time" name="event-time" type="time" required></div></div>
<div class="field"><label for="event-category">行程類別</label><select id="event-category" name="event-category"><option value="💼 工作">💼 工作</option><option value="☕ 生活">☕ 生活</option><option value="💗 健康">💗 健康</option><option value="✨ 其他">✨ 其他</option></select></div>
<div class="field"><label for="custom-category">自訂類別名稱（選填）</label><input id="custom-category" name="custom-category" type="text" maxlength="20" placeholder="例如：進修、家庭、休閒"></div>
<div class="field"><label for="event-note">備註（選填）</label><textarea id="event-note" name="event-note" placeholder="補充地點或其他提醒…"></textarea></div>
<button class="submit" type="submit">＋　加入行程</button><p class="notice" id="form-notice" role="status" aria-live="polite"></p></form></section></div></main>
<script>
const today=new Date();document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);
const dateInput=document.getElementById('event-date');const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);dateInput.value=localDate;
const categorySelect=document.getElementById('event-category');const customCategoryInput=document.getElementById('custom-category');const categoryStorageKey='daynote-custom-categories';
let savedCategories=[];try{savedCategories=JSON.parse(localStorage.getItem(categoryStorageKey)||'[]')}catch{savedCategories=[]}
savedCategories.filter(category=>typeof category==='string'&&category.trim()).forEach(category=>{const option=document.createElement('option');option.value=category;option.textContent=category;categorySelect.append(option)});
categorySelect.addEventListener('change',()=>{customCategoryInput.value='';customCategoryInput.placeholder='例如：進修、家庭、休閒'});
customCategoryInput.addEventListener('input',()=>{if(customCategoryInput.value.trim())categorySelect.selectedIndex=-1;});
document.getElementById('event-form').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('event-name').value.trim(),time=document.getElementById('event-time').value,defaultCategory=categorySelect.value,customCategory=customCategoryInput.value.trim(),isCustomCategory=customCategory.length>0,plainCategory=isCustomCategory?customCategory:defaultCategory,category=isCustomCategory?`🏷️ ${customCategory}`:defaultCategory,note=document.getElementById('event-note').value.trim();const item=document.createElement('article');item.className='agenda-item';const timeLabel=document.createElement('time');timeLabel.className='time';timeLabel.textContent=time;const bar=document.createElement('span');bar.className='timebar';const details=document.createElement('div');const title=document.createElement('h3');title.className='event-title';title.textContent=name;details.append(title);if(note){const p=document.createElement('p');p.className='event-note';p.textContent=note;details.append(p)}if(isCustomCategory){const hasCategory=Array.from(categorySelect.options).some(option=>option.value.toLocaleLowerCase()===plainCategory.toLocaleLowerCase());if(!hasCategory){const option=document.createElement('option');option.value=plainCategory;option.textContent=`🏷️ ${plainCategory}`;categorySelect.append(option);try{savedCategories.push(plainCategory);localStorage.setItem(categoryStorageKey,JSON.stringify(savedCategories))}catch{}}categorySelect.value=plainCategory}const tag=document.createElement('span');tag.className='tag';tag.textContent=category;item.append(timeLabel,bar,details,tag);document.querySelector('.agenda-list').append(item);document.querySelector('.agenda-list').closest('.card').querySelector('.count').textContent=`共 ${document.querySelectorAll('.agenda-item').length} 個行程`;document.getElementById('form-notice').textContent='行程已加入清單。';event.target.reset();categorySelect.value=isCustomCategory?plainCategory:'💼 工作';dateInput.value=localDate});
</script></body></html>
